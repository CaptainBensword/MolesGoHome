<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moles Go Home — First Light</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;overflow:hidden;background:#101b19;color:#f3f0df}
    canvas{display:block}
    #hud{position:fixed;inset:0;pointer-events:none}
    .brand{position:absolute;left:25px;top:22px;text-shadow:0 2px 12px #000}
    .brand b{display:block;font-size:18px;letter-spacing:.18em}
    .brand span{font-size:10px;letter-spacing:.24em;color:#c5c6a9}
    .panel{position:absolute;left:24px;bottom:24px;width:220px;padding:14px 16px;background:#101a18d9;border:1px solid #a9a27a55;border-radius:10px;box-shadow:0 10px 30px #0005}
    .statline{display:flex;justify-content:space-between;font-size:11px;color:#d7d5c4;margin-bottom:7px}
    .bar{height:7px;background:#3a3430;border-radius:9px;overflow:hidden;margin-bottom:11px}
    .fill{height:100%;width:100%;background:linear-gradient(90deg,#a63c36,#df7654)}
    .xp{background:linear-gradient(90deg,#b28a42,#e8d28a);width:12%}
    .help{position:absolute;right:24px;bottom:24px;padding:13px 16px;background:#101a18d9;border:1px solid #a9a27a55;border-radius:10px;color:#d5d2bd;font-size:11px;line-height:1.8;text-align:right}
    kbd{padding:2px 5px;border:1px solid #77745e;border-radius:4px;color:#fff}
    #notice{position:absolute;top:23px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:20px;background:#101a18b8;border:1px solid #b9a66a55;color:#e8dfbd;font-size:11px;letter-spacing:.08em;white-space:nowrap}
    #crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;border:1px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);opacity:.65}
    @media(max-width:650px){.help{display:none}.panel{left:12px;bottom:12px}.brand{left:14px;top:14px}#notice{top:72px}}
  </style>
</head>
<body>
<div id="hud">
  <div class="brand"><b>MOLES GO HOME</b><span>THE FIRST FRONTIER</span></div>
  <div id="notice">A new world is waiting. Explore.</div>
  <div id="crosshair"></div>
  <div class="panel">
    <div class="statline"><span>VITALITY</span><span id="healthText">100 / 100</span></div>
    <div class="bar"><div class="fill" id="healthFill"></div></div>
    <div class="statline"><span>EXPERIENCE</span><span>LEVEL 1</span></div>
    <div class="bar"><div class="fill xp"></div></div>
    <div class="statline"><span>WANDERER</span><span>LV. 1</span></div>
  </div>
  <div class="help"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> Move<br><kbd>SPACE</kbd> Jump<br>Mouse Move camera<br><kbd>CLICK</kbd> Attack</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb7b0);
scene.fog=new THREE.FogExp2(0x9bb7b0,0.009);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdcebe4,0x536047,2.0));
const sun=new THREE.DirectionalLight(0xffedcf,2.5);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x71865a);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Soft patches give the meadow some natural variation without noisy textures.
for(let i=0;i<180;i++){
 const patch=new THREE.Mesh(new THREE.CircleGeometry(THREE.MathUtils.randFloat(1.2,5),12),mat([0x7e905e,0x657b50,0x899365,0x718158][i%4]));
 patch.rotation.x=-Math.PI/2;patch.position.set(THREE.MathUtils.randFloatSpread(230),.012,THREE.MathUtils.randFloatSpread(230));patch.scale.y=THREE.MathUtils.randFloat(.5,1.5);scene.add(patch);
}
const trunkMat=mat(0x594638),leafMats=[mat(0x385b43),mat(0x496c4c),mat(0x58764c)];
function tree(x,z,s=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.34,2.5,7),trunkMat);trunk.position.y=1.25;trunk.castShadow=true;g.add(trunk);
 for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.ConeGeometry(1.45-j*.2,2.5,7),leafMats[(j+Math.floor(x+z))%3]);crown.position.set(0,2.7+j*.72,0);crown.castShadow=true;g.add(crown);}
 scene.add(g);
}
for(let i=0;i<95;i++){let x=THREE.MathUtils.randFloatSpread(150),z=THREE.MathUtils.randFloatSpread(150);if(Math.hypot(x,z)>13)tree(x,z,THREE.MathUtils.randFloat(.75,1.45));}
const rockMat=mat(0x777b70);
for(let i=0;i<45;i++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(THREE.MathUtils.randFloat(.35,1.3),0),rockMat);r.position.set(THREE.MathUtils.randFloatSpread(120),.35,THREE.MathUtils.randFloatSpread(120));r.scale.y=.65;r.castShadow=true;r.receiveShadow=true;scene.add(r);}

// Player: a readable placeholder adventurer built from real 3D meshes.
const player=new THREE.Group();scene.add(player);
const skin=mat(0xd6ad85),cloth=mat(0x344c58),leather=mat(0x49372c),metal=mat(0xb6b9b1,.45);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,5,8),cloth);body.position.y=1.12;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),skin);head.position.y=1.92;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8,0,Math.PI*2,0,Math.PI*.55),leather);hair.position.y=2.02;player.add(hair);
const sword=new THREE.Group();const blade=new THREE.Mesh(new THREE.BoxGeometry(.09,.9,.045),metal);blade.position.y=.55;sword.add(blade);const hilt=new THREE.Mesh(new THREE.BoxGeometry(.32,.08,.1),leather);hilt.position.y=.12;sword.add(hilt);sword.position.set(.48,1.05,0);sword.rotation.z=-.3;player.add(sword);

const enemyMat=mat(0x68734a),enemyDark=mat(0x343a2b);
const enemies=[];
for(const [x,z] of [[7,-9],[-10,-15],[14,12],[-18,8],[4,22]]){
 const e=new THREE.Group();const torso=new THREE.Mesh(new THREE.SphereGeometry(.7,12,10),enemyMat);torso.position.y=.75;torso.scale.y=1.1;torso.castShadow=true;e.add(torso);
 const headE=new THREE.Mesh(new THREE.SphereGeometry(.4,12,10),enemyDark);headE.position.set(0,1.55,.12);e.add(headE);e.position.set(x,0,z);scene.add(e);enemies.push({mesh:e,hp:3,alive:true});
}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0,pitch=.28,drag=false,lastX=0,lastY=0,health=100;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===2){drag=true;lastX=e.clientX;lastY=e.clientY;}else if(e.button===0)attack();});
addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.004,-.05,.8);lastX=e.clientX;lastY=e.clientY;}});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
function attack(){sword.rotation.z=-1.5;setTimeout(()=>sword.rotation.z=-.3,180);for(const e of enemies){if(!e.alive)continue;const d=player.position.distanceTo(e.mesh.position);if(d<3.3){e.hp--;e.mesh.position.add(new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).multiplyScalar(1.1));if(e.hp<=0){e.alive=false;scene.remove(e.mesh);document.getElementById('notice').textContent='Creature defeated — the frontier grows quieter.';}break;}}}
let vy=0,onGround=true;const clock=new THREE.Clock();const forward=new THREE.Vector3(),right=new THREE.Vector3(),move=new THREE.Vector3();
camera.position.set(0,5,8);
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 forward.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));move.set(0,0,0);
 if(keys.KeyW||keys.ArrowUp)move.add(forward);if(keys.KeyS||keys.ArrowDown)move.sub(forward);if(keys.KeyD||keys.ArrowRight)move.add(right);if(keys.KeyA||keys.ArrowLeft)move.sub(right);
 if(move.lengthSq()){move.normalize();player.position.addScaledVector(move,7*dt);player.rotation.y=Math.atan2(move.x,move.z);}
 if(keys.Space&&onGround){vy=8;onGround=false;}vy-=20*dt;player.position.y+=vy*dt;if(player.position.y<0){player.position.y=0;vy=0;onGround=true;}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-115,115);player.position.z=THREE.MathUtils.clamp(player.position.z,-115,115);
 const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*Math.cos(pitch)*8,player.position.y+3+Math.sin(pitch)*8,player.position.z+Math.cos(yaw)*Math.cos(pitch)*8);
 camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.1,player.position.z);
 enemies.forEach(e=>{if(e.alive)e.mesh.rotation.y+=dt*.35;});
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
